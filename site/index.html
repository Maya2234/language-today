<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language Today</title>
<meta name="description" content="An interactive atlas of which languages are spoken where, by how many people, and how that changed since 1960.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-languages" viewBox="0 0 24 24"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></symbol>
    <symbol id="i-multi" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-diversity" viewBox="0 0 24 24"><path d="M12 22V12M12 12C12 7 8 4 3 4c0 5 4 8 9 8ZM12 12c0-4 3-7 8-7 0 4-3 7-8 7Z"/></symbol>
    <symbol id="i-talk" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10z"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 4v16M16 4v16"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
  </defs>
</svg>

<div class="app">
  <aside class="side" aria-label="Atlas controls">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--chart-3)"/><path d="M4 16h24M16 2c5 4 5 24 0 28M16 2c-5 4-5 24 0 28" stroke="#fff" stroke-width="2" fill="none"/></svg>
      <div><h1>Language Today</h1><p>World languages, 1960–2026</p></div>
    </div>
    <nav class="nav" aria-label="Map layer">
      <p class="navlabel">Map layer</p>
      <button data-mode="languages" aria-current="true"><svg class="i"><use href="#i-languages"/></svg>Languages</button>
      <button data-mode="multilingual"><svg class="i"><use href="#i-multi"/></svg>Multilingualism</button>
      <button data-mode="diversity"><svg class="i"><use href="#i-diversity"/></svg>Diversity &amp; dialects</button>
      <button data-mode="reach"><svg class="i"><use href="#i-talk"/></svg>Where can I talk?</button>
    </nav>
    <section id="modeControls" class="controls" aria-live="polite"></section>
    <div class="sidefoot">
      <button class="btn ghost" id="aboutLink"><svg class="i"><use href="#i-info"/></svg>Data &amp; method</button>
    </div>
  </aside>

  <main class="canvas">
    <section class="mapcard" aria-label="Map">
      <svg id="map" role="img" aria-label="World map. Hover a country to see its languages; click for details."></svg>
      <div class="maptools" role="toolbar" aria-label="Map view">
        <div class="tgroup" role="group" aria-label="Projection">
          <button class="ibtn" data-proj="flat" aria-pressed="true" aria-label="Flat map" data-tip="Flat map"><svg class="i"><use href="#i-map"/></svg></button>
          <button class="ibtn" data-proj="globe" aria-pressed="false" aria-label="Globe" data-tip="Globe"><svg class="i"><use href="#i-globe"/></svg></button>
        </div>
        <div class="tgroup" role="group" aria-label="Zoom">
          <button class="ibtn" id="zoomIn" aria-label="Zoom in"><svg class="i"><use href="#i-plus"/></svg></button>
          <button class="ibtn" id="zoomOut" aria-label="Zoom out"><svg class="i"><use href="#i-minus"/></svg></button>
          <button class="ibtn" id="zoomReset" aria-label="Reset view"><svg class="i"><use href="#i-reset"/></svg></button>
        </div>
      </div>
      <div id="legend" class="legend"></div>
      <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    </section>
    <section class="timebar" aria-label="Year">
      <button id="play" class="ibtn solid" aria-label="Play through the years"><svg class="i"><use href="#i-play"/></svg></button>
      <label for="year" class="yearlabel"><output id="yearOut">2026</output><span id="yearNote"></span></label>
      <input id="year" type="range" min="1960" max="2026" step="1" value="2026">
    </section>
  </main>

  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<dialog id="about">
  <div class="dialoghead"><h2>Data &amp; method</h2><form method="dialog"><button class="ibtn" aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></form></div>
  <div id="aboutBody"></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
